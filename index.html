<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta charset="UTF-8">
  <title>Dashboard Susu Kia</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      font-family: -apple-system, sans-serif;
      color: #4a4a4a;
      background: #fdf6f0;
    }
    .wrap {
      max-width: 420px;
      margin: 0 auto;
      padding: 24px 16px;
      text-align: center;
    }
    h2 { color: #5b7c8a; margin-bottom: 4px; }
    .sub { color: #a89b93; font-size: 14px; margin-bottom: 20px; }
    .total {
      background: white;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.05);
    }
    .total .angka { font-size: 40px; font-weight: 700; color: #5b7c8a; }
    .total .label { font-size: 13px; color: #a89b93; }
    .item {
      background: white;
      border-radius: 12px;
      padding: 12px 16px;
      margin-bottom: 8px;
      font-size: 16px;
      font-weight: 600;
      text-align: left;
    }
    .grafik {
      background: white;
      border-radius: 16px;
      padding: 16px;
      margin-top: 24px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.05);
    }
    .grafik h3 { margin: 0 0 16px; font-size: 14px; color: #7a7268; text-align: left; }
    .bar-chart {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      height: 120px;
      gap: 4px;
      width: 100%;
    }
    .bar-col {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      height: 100%;
    }
    .bar {
      width: 100%;
      background: #a8cdd7;
      border-radius: 6px 6px 0 0;
      min-height: 4px;
      transition: height 0.3s;
    }
    .bar.hari-ini { background: #f4b8ab; }
    .bar-angka { font-size: 11px; font-weight: 700; color: #7a7268; margin-bottom: 4px; }
    .bar-label { font-size: 9px; color: #a89b93; margin-top: 6px; white-space: nowrap; }
    #loading { color: #a89b93; padding: 40px 0; }
  </style>
</head>
<body>
  <div class="wrap">
    <h2>🍼 Susu Kia</h2>
    <div class="sub">Riwayat hari ini</div>
    <div id="loading">Memuat...</div>
    <div id="konten" style="display:none;">
      <div class="total">
        <div class="angka" id="totalAngka">0</div>
        <div class="label">kali hari ini</div>
      </div>
      <div id="list"></div>

      <div class="grafik">
        <h3>7 hari terakhir</h3>
        <div class="bar-chart" id="barChart"></div>
      </div>
    </div>
  </div>

  <script>
    // GANTI dua ini sesuai Sheet kamu:
    var SHEET_ID = '1aBhGNP7LP9D0Ig38mA1HVwYiEwAhL07UO6Zp792h40A';
    var GID = '0'; // gid tab "Log_Susu_Kia" — cek di URL pas tab itu lagi kebuka, setelah #gid=

    var url = 'https://docs.google.com/spreadsheets/d/' + SHEET_ID + '/gviz/tq?tqx=out:json&sheet=Log_Susu_Kia';

    fetch(url)
      .then(function(res) { return res.text(); })
      .then(function(text) {
        var json = JSON.parse(text.substring(text.indexOf('(') + 1, text.lastIndexOf(')')));
        var rows = json.table.rows;

        var tz_offset_hours = 7; // WIB
        var now = new Date();
        var hariIniStr = now.toISOString().split('T')[0];

        var listHariIni = [];
        var perTanggal = {};

        rows.forEach(function(r) {
          if (!r.c[0] || !r.c[0].v) return;
          var raw = r.c[0].v; // format gviz: "Date(2026,8,10,14,20,0)"
          var m = /Date\((\d+),(\d+),(\d+),(\d+),(\d+),(\d+)\)/.exec(raw);
          if (!m) return;
          var d = new Date(parseInt(m[1]), parseInt(m[2]), parseInt(m[3]), parseInt(m[4]), parseInt(m[5]), parseInt(m[6]));
          var tglStr = d.toISOString().split('T')[0];
          var jamStr = ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2);

          perTanggal[tglStr] = (perTanggal[tglStr] || 0) + 1;
          if (tglStr === hariIniStr) listHariIni.unshift(jamStr);
        });

        document.getElementById('loading').style.display = 'none';
        document.getElementById('konten').style.display = 'block';
        document.getElementById('totalAngka').textContent = listHariIni.length;

        var listEl = document.getElementById('list');
        if (listHariIni.length === 0) {
          listEl.innerHTML = '<div style="color:#a89b93;padding:12px 0;">Belum ada catatan hari ini</div>';
        } else {
          listHariIni.forEach(function(jam) {
            listEl.innerHTML += '<div class="item">' + jam + '</div>';
          });
        }

        var riwayat = [];
        for (var d2 = 6; d2 >= 0; d2--) {
          var tgl = new Date();
          tgl.setDate(tgl.getDate() - d2);
          var tglStr2 = tgl.toISOString().split('T')[0];
          var label = tgl.toLocaleDateString('id-ID', { weekday: 'short', day: '2-digit' });
          riwayat.push({ label: label, total: perTanggal[tglStr2] || 0 });
        }

        var max = Math.max.apply(null, riwayat.map(function(r) { return r.total; }).concat([1]));
        var chartEl = document.getElementById('barChart');
        riwayat.forEach(function(r, idx) {
          var tinggiPersen = (r.total / max) * 100;
          var isHariIni = idx === riwayat.length - 1;
          chartEl.innerHTML +=
            '<div class="bar-col">' +
              '<div class="bar-angka">' + r.total + '</div>' +
              '<div class="bar' + (isHariIni ? ' hari-ini' : '') + '" style="height:' + Math.max(tinggiPersen, 4) + '%;"></div>' +
              '<div class="bar-label">' + r.label + '</div>' +
            '</div>';
        });
      })
      .catch(function(err) {
        document.getElementById('loading').textContent = 'Gagal memuat: ' + err.message;
      });
  </script>
</body>
</html>
